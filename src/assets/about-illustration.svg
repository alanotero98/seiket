      <stop offset="0" stop-color="#122c45"></stop>
      <stop offset="1" stop-color="#0284c7"></stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"></stop>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="32" fill="url(#sky)"></rect>

  <circle cx="500" cy="120" r="70" fill="#ffffff" fill-opacity="0.08"></circle>
  <circle cx="120" cy="90" r="90" fill="#ffffff" fill-opacity="0.05"></circle>

  <!-- Edificio izquierdo -->
  <rect x="96" y="196" width="128" height="240" rx="10" fill="url(#glass)"></rect>
  <g fill="#ffffff" fill-opacity="0.55">
