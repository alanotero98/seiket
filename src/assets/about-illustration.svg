    <rect x="156" y="304" width="24" height="24" rx="4"></rect>
  </g>

  <!-- Edificio principal -->
  <rect x="248" y="120" width="164" height="316" rx="12" fill="url(#glass)"></rect>
  <g fill="#ffffff" fill-opacity="0.7">
    <rect x="272" y="148" width="30" height="30" rx="5"></rect>
    <rect x="316" y="148" width="30" height="30" rx="5"></rect>
    <rect x="360" y="148" width="30" height="30" rx="5"></rect>
    <rect x="272" y="196" width="30" height="30" rx="5"></rect>
    <rect x="316" y="196" width="30" height="30" rx="5"></rect>
    <rect x="360" y="196" width="30" height="30" rx="5"></rect>
    <rect x="272" y="244" width="30" height="30" rx="5"></rect>
    <rect x="316" y="244" width="30" height="30" rx="5"></rect>
    <rect x="360" y="244" width="30" height="30" rx="5"></rect>
    <rect x="272" y="292" width="30" height="30" rx="5"></rect>
    <rect x="316" y="292" width="30" height="30" rx="5"></rect>
    <rect x="360" y="292" width="30" height="30" rx="5"></rect>
